<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Операционный и технический специалист с 4+ годами опыта в EdTech и Digital. Аналитика, автоматизация, автоворонки, процессы.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Владислав Слащевский — Operations & Technical Specialist">
    <meta property="og:description" content="Выстраиваю системы, аналитику и процессы для онлайн-бизнеса">
    <meta property="og:locale" content="ru_RU">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config={theme:{extend:{colors:{em:{600:'#047857',500:'#059669',400:'#10b981',300:'#34d399',200:'#6ee7b7',100:'#a7f3d0'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}
    </script>
    <style>
        :root{--bg:#07080c;--bg2:rgba(7,8,12,0.88);--card:rgba(255,255,255,0.03);--cardh:rgba(255,255,255,0.06);--cards:rgba(255,255,255,0.05);--bdr:rgba(255,255,255,0.06);--bdrh:rgba(255,255,255,0.12);--bdrs:rgba(255,255,255,0.08);--tx:#e2e8f0;--tx2:rgba(255,255,255,0.55);--tx3:rgba(255,255,255,0.35);--tx4:rgba(255,255,255,0.2);--acc:#10b981;--acc2:#34d399;--abg:rgba(16,185,129,0.1);--orb1:rgba(5,150,105,0.07);--orb2:rgba(16,185,129,0.05);--orb3:rgba(4,120,87,0.04);--mesh:rgba(16,185,129,0.06)}
        .light{--bg:#f6f7f9;--bg2:rgba(246,247,249,0.9);--card:rgba(255,255,255,0.7);--cardh:rgba(255,255,255,0.88);--cards:rgba(255,255,255,0.8);--bdr:rgba(0,0,0,0.07);--bdrh:rgba(0,0,0,0.14);--bdrs:rgba(0,0,0,0.1);--tx:#1a1d2e;--tx2:rgba(26,29,46,0.55);--tx3:rgba(26,29,46,0.35);--tx4:rgba(26,29,46,0.18);--acc:#059669;--acc2:#10b981;--abg:rgba(5,150,105,0.08);--orb1:rgba(5,150,105,0.03);--orb2:rgba(16,185,129,0.025);--orb3:rgba(4,120,87,0.02);--mesh:rgba(5,150,105,0.04)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;transition:background .5s ease,color .5s ease}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bdrh);border-radius:3px}
        .glass{background:var(--card);border:1px solid var(--bdr);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:all .3s ease}
        .glass:hover{background:var(--cardh);border-color:var(--bdrh)}
        .gs{background:var(--cards);border:1px solid var(--bdrs);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
        .t1{color:var(--tx)}.t2{color:var(--tx2)}.t3{color:var(--tx3)}.t4{color:var(--tx4)}.ac{color:var(--acc)}.abg{background:var(--abg);color:var(--acc)}
        .gt{background:linear-gradient(135deg,var(--acc),var(--acc2),#6ee7b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .gtw{background:linear-gradient(135deg,#d97706,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .gb{box-shadow:0 0 24px rgba(16,185,129,0.25),0 4px 12px rgba(16,185,129,0.15)}
        .orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0;transition:background .5s}
        @keyframes od{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-40px)}66%{transform:translate(-20px,30px)}}
        @keyframes fi{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes pulse-line{0%,100%{opacity:.3;transform:scaleY(1)}50%{opacity:.8;transform:scaleY(1.2)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes toast-in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes mesh-f{0%,100%{opacity:.7;transform:scale(1) translate(0,0)}50%{opacity:1;transform:scale(1.05) translate(10px,-10px)}}
        .af{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}.af.v{opacity:1;transform:translateY(0)}
        .bg{transform-origin:bottom;transform:scaleY(0);transition:transform 1s cubic-bezier(.16,1,.3,1)}.bg.v{transform:scaleY(1)}
        .bp{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;padding:12px 28px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:all .3s ease;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
        .bp:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(16,185,129,0.3)}
        .bs{background:var(--card);color:var(--tx);border:1px solid var(--bdr);padding:12px 28px;border-radius:12px;font-weight:500;font-size:14px;cursor:pointer;transition:all .3s ease;display:inline-flex;align-items:center;gap:8px;text-decoration:none;backdrop-filter:blur(10px)}
        .bs:hover{background:var(--cardh);border-color:var(--bdrh);transform:translateY(-2px)}
        .ec{position:relative;overflow:hidden;transition:all .35s ease}.ec::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);transform:scaleX(0);transition:transform .35s ease}.ec:hover::after{transform:scaleX(1)}.ec:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.15)}
        .cb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.16,1,.3,1)}.cc.open .cb{grid-template-rows:1fr}.cb>div{overflow:hidden}
        .chv{transition:transform .3s}.cc.open .chv{transform:rotate(180deg)}
        .sb{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--bdr);transition:all .3s;cursor:default;white-space:nowrap;color:var(--tx2)}
        .sb:hover{background:var(--abg);border-color:rgba(16,185,129,0.3);color:var(--acc);transform:translateY(-2px)}
        .wl{height:2px;background:var(--bdr);flex:1;overflow:hidden}.wl .fl{height:100%;background:linear-gradient(90deg,#059669,#34d399);width:0;transition:width 1.5s cubic-bezier(.16,1,.3,1)}.wl.v .fl{width:100%}
        .tm{position:fixed;bottom:30px;right:30px;z-index:9999;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:500;pointer-events:none;animation:toast-in .4s ease forwards}
        .mm{position:fixed;inset:0;z-index:100;background:var(--bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1)}.mm.open{transform:translateX(0)}
        .ls{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99999}
        .lsp{width:36px;height:36px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
        .hero-mesh{position:absolute;inset:0;pointer-events:none;z-index:0;animation:mesh-f 12s ease-in-out infinite}
        .hero-mesh::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 15% 35%,var(--mesh) 0%,transparent 70%),radial-gradient(ellipse 50% 70% at 85% 55%,var(--mesh) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 50% 85%,var(--mesh) 0%,transparent 60%)}
        .theme-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--bdr);cursor:pointer;transition:all .3s;color:var(--tx2);flex-shrink:0}
        .theme-btn:hover{background:var(--cardh);border-color:var(--bdrh);color:var(--acc)}
        .scroll-hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.3}
        .scroll-hint .line{width:1px;height:32px;background:linear-gradient(to bottom,var(--tx2),transparent);animation:pulse-line 2s ease-in-out infinite}
        @media(max-width:768px){.hg{grid-template-columns:1fr!important}.hd{grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}}
        @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
    </style>
</head>
<body>
    <div id="root"><div class="ls" id="loader"><div class="lsp"></div></div></div>
    <div class="orb" style="width:700px;height:700px;background:var(--orb1);top:-300px;left:-300px;animation:od 25s ease-in-out infinite"></div>
    <div class="orb" style="width:500px;height:500px;background:var(--orb2);bottom:-200px;right:-200px;animation:od 30s ease-in-out infinite reverse"></div>
    <div class="orb" style="width:400px;height:400px;background:var(--orb3);top:50%;left:50%;animation:od 35s ease-in-out infinite 5s"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-presets="react">
    /* ===== ICON COMPONENT ===== */
    function Ic({n,s=20}){
        const p={xmlns:"http://www.w3.org/2000/svg",width:s,height:s,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"};
        switch(n){
            case 'send':return <svg {...p}><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>;
            case 'up':return <svg {...p}><path d="M5 12l7-7 7 7"/><path d="M12 19V5"/></svg>;
            case 'trend':return <svg {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
            case 'bar':return <svg {...p}><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>;
            case 'target':return <svg {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
            case 'zap':return <svg {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
            case 'layers':return <svg {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
            case 'clock':return <svg {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
            case 'award':return <svg {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
            case 'dl':return <svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
            case 'cal':return <svg {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
            case 'menu':return <svg {...p}><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
            case 'x':return <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
            case 'chev':return <svg {...p}><polyline points="6 9 12 15 18 9"/></svg>;
            case 'phone':return <svg {...p}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
            case 'check':return <svg {...p}><polyline points="20 6 9 17 4 12"/></svg>;
            case 'db':return <svg {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
            case 'wf':return <svg {...p}><circle cx="5" cy="6" r="3"/><circle cx="19" cy="18" r="3"/><path d="M7 8.5L17 15.5"/><circle cx="12" cy="12" r="3"/></svg>;
            case 'sun':return <svg {...p}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
            case 'moon':return <svg {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
            case 'shield':return <svg {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
            case 'users':return <svg {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
            case 'search':return <svg {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
            case 'mail':return <svg {...p}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
            case 'wrench':return <svg {...p}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>;
            case 'globe':return <svg {...p}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
            case 'arrow-r':return <svg {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
            case 'settings':return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
            default:return null;
        }
    }

    /* ===== HOOKS ===== */
    function useIV(){const[v,s]=React.useState(false);const r=React.useRef(null);React.useEffect(()=>{const el=r.current;if(!el)return;const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){s(true);obs.unobserve(el);}},{threshold:0.1});obs.observe(el);return()=>obs.disconnect();},[]);return[r,v];}
    function useCnt(end,dur,act){const[v,s]=React.useState(0);React.useEffect(()=>{if(!act)return;let st=null;function step(ts){if(!st)st=ts;const p=Math.min((ts-st)/dur,1);s(Math.round(end*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);},[act,end,dur]);return v;}
    function useSc(){const[v,s]=React.useState(0);React.useEffect(()=>{const h=()=>s(window.scrollY);window.addEventListener('scroll',h,{passive:true});return()=>window.removeEventListener('scroll',h);},[]);return v;}

    /* ===== THEME CONTEXT ===== */
    const TC=React.createContext({theme:'dark',toggle:()=>{}});
    function useTheme(){return React.useContext(TC);}

    /* ===== TOAST ===== */
    let _tt=null;
    function toast(m){const o=document.querySelector('.tm');if(o)o.remove();clearTimeout(_tt);const e=document.createElement('div');e.className='tm gs ac';e.textContent=m;document.body.appendChild(e);_tt=setTimeout(()=>{e.style.opacity='0';e.style.transform='translateY(10px)';e.style.transition='all .3s';setTimeout(()=>e.remove(),300);},3000);}

    /* ===== BAR COMPARE ===== */
    function BarC({before,after,active,bL,aL}){
        const mx=Math.max(before,after)*1.25||1;
        const bh=(before/mx)*120, ah=(after/mx)*120;
        return (
            <div className="flex flex-col items-center gap-3">
                <div className="flex items-end gap-5" style={{height:140}}>
                    <div className="flex flex-col items-center gap-2">
                        <span className="text-xs font-semibold ac">{aL||after}</span>
                        <div className={`w-14 rounded-lg bg${active?' v':''}`} style={{height:ah,background:'linear-gradient(to top, #059669, #34d399)',transitionDelay:active?'0.3s':'0s'}}/>
                    </div>
                    <div className="flex flex-col items-center gap-2">
                        <span className="text-xs font-medium t3">{bL||before}</span>
                        <div className={`w-14 rounded-lg bg${active?' v':''}`} style={{height:bh,background:'var(--bdr)',transitionDelay:active?'0s':'0s'}}/>
                    </div>
                </div>
            </div>
        );
    }

    /* ===== SECTION TITLE ===== */
    function ST({title,subtitle}){
        const[r,iv]=useIV();
        return (
            <div ref={r} className={`af${iv?' v':''} text-center mb-16`}>
                <h2 className="text-3xl md:text-4xl font-bold t1 mb-4">{title}</h2>
                {subtitle&&<p className="t2 text-base md:text-lg max-w-2xl mx-auto">{subtitle}</p>}
                <div className="w-12 h-0.5 mx-auto mt-6 rounded-full" style={{background:'linear-gradient(90deg, transparent, var(--acc), transparent)'}}/>
            </div>
        );
    }

    /* ===== NAVBAR ===== */
    function Nav(){
        const sc=useSc();
        const{theme,toggle}=useTheme();
        const[mob,setMob]=React.useState(false);
        const links=[{id:'about',l:'Обо мне'},{id:'impact',l:'Результаты'},{id:'cases',l:'Кейсы'},{id:'skills',l:'Навыки'},{id:'workflow',l:'Процесс'},{id:'exp',l:'Опыт'},{id:'contact',l:'Контакт'}];
        const ns={background:sc>50?'var(--bg2)':'transparent',backdropFilter:sc>50?'blur(20px)':'none',borderBottom:sc>50?'1px solid var(--bdr)':'1px solid transparent'};
        return (
            <nav className="fixed top-0 left-0 right-0 z-50 transition-all duration-300" style={ns}>
                <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                    <a href="#" className="t1 font-bold text-lg tracking-tight">В.Слащевский</a>
                    <div className="hidden lg:flex items-center gap-8">{links.map(l=><a key={l.id} href={`#${l.id}`} className="text-sm t2 hover:t1 transition-colors">{l.l}</a>)}</div>
                    <div className="flex items-center gap-3">

    <script>
    /* Fast smooth scroll — overrides default CSS smooth scroll */
    document.addEventListener('click',function(e){
        var a=e.target.closest('a[href^="#"]');
        if(!a)return;
        var href=a.getAttribute('href');
        if(href==='#')return;
        e.preventDefault();
        var target=document.querySelector(href);
        if(!target)return;
        var y=target.getBoundingClientRect().top+window.scrollY-80;
        var start=window.scrollY;
        var dist=y-start;
        var dur=Math.min(Math.max(Math.abs(dist)*0.35,200),600);
        var st=null;
        function step(ts){
            if(!st)st=ts;
            var p=Math.min((ts-st)/dur,1);
            var ease=1-Math.pow(1-p,3);
            window.scrollTo(0,start+dist*ease);
            if(p<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    });
    </script>
