    /* Sparkline mini chart */
    function Spark({data,color='#10b981',w=80,h=30}){
        const mx=Math.max(...data),mn=Math.min(...data),rng=mx-mn||1;

        const gy=[0,0.25,0.5,0.75,1].map(pct=>{

        });
        return (
            <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{overflow:'visible'}}>
                <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.25"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>

            <div className="flex flex-col items-center gap-3">

                                                    <div className={`text-lg font-bold ${c.am?'gtw':'gt'}`}>{m.v}</div>
                                                    <div className="text-xs text-white/35 mt-1">{m.l}</div>
                                                </div>
                                            ))}
                                        </div>
                                        {c.cd && isO && (
                                            <div className="mt-4 grid grid-cols-3 gap-3">
                                                {c.cd.map((d,j)=>(
                                                    <div key={j} className="glass rounded-xl p-4">
                                                        <BarC before={d.b} after={d.a} active={isO} bL={d.b.toFixed(1)} aL={d.a.toFixed(1)}/>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </section>
        );
    }

    /* ===== SKILLS ===== */
    function Skills(){
        const [r,iv]=useIV();
        const cats=[
            {level:U('sk.a'),key:'em',items:['GetCourse','Salebot','Senler','BotHelp','Zoom','Smsc','OnlinePBX','Automation','Analytics','Funnel Systems','ChatGPT','Midjourney','Team Coordination','Technical Support','Integrations','Reporting','Data Analysis']},
            {level:U('sk.m'),key:'blue',items:['amoCRM','OBS','Canva','Airtable','Trello','ClickUp','Notion']},
            {level:U('sk.b'),key:'slate',items:['HTML','CSS']}
        ];
        const cm={em:'bg-em-500/10 text-em-400',blue:'bg-sky-500/10 text-sky-400',slate:'bg-slate-500/10 text-slate-400'};
        return (
            <section id="skills" className="relative py-24 md:py-32 px-6">
                <div className="max-w-5xl mx-auto">
                    <ST title={U('sk.t')}/>
                    <div ref={r} className="space-y-8">
                        {cats.map((cat,ci)=>(
                            <div key={ci} className={`af${iv?' v':''}`} style={{transitionDelay:`${ci*0.15}s`}}>
                                <div className={`inline-flex items-center gap-2 ${cm[cat.key]} rounded-full px-4 py-1.5 text-xs font-semibold uppercase tracking-wider mb-4`}>{cat.level}</div>
                                <div className="flex flex-wrap gap-2.5">{cat.items.map((sk,si)=><span key={si} className="sb">{sk}</span>)}</div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );
    }

    /* ===== WORKFLOW ===== */
    function Workflow(){
        const [r,iv]=useIV();
        const steps=U('wf.s');
        const icons=[<IcDB size={20}/>,<IcLayers size={20}/>,<IcWF size={20}/>,<IcZap size={20}/>,<IcBar size={20}/>,<IcTrend size={20}/>];
        return (
            <section id="workflow" className="relative py-24 md:py-32 px-6">
                <div className="max-w-5xl mx-auto">
                    <ST title={U('wf.t')}/>
                    <div ref={r}>
                        <div className="hidden md:flex items-start">
                            {steps.map((step,i)=>(
                                <React.Fragment key={i}>
                                    <div className={`af${iv?' v':''}`} style={{transitionDelay:`${i*0.15}s`,flex:'0 0 auto'}} >
                                        <div className="workflow-step flex flex-col items-center text-center">
                                            <div className="w-14 h-14 rounded-2xl bg-em-500/10 border border-em-500/20 flex items-center justify-center text-em-400 mb-4 relative z-10">{icons[i]}</div>
                                            <div className="text-xs text-white/30 font-mono mb-2">0{i+1}</div>
                                            <div className="text-sm text-white/70 font-medium" style={{maxWidth:'120px'}}>{step}</div>
                                        </div>
                                    </div>
                                    {i<steps.length-1 && <div className={`wl${iv?' v':''}`} style={{marginTop:'28px',transitionDelay:`${i*0.15+0.3}s`}}><div className="fl"/></div>}
                                </React.Fragment>
                            ))}
                        </div>
                        <div className="md:hidden space-y-4">
                            {steps.map((step,i)=>(
                                <div key={i} className={`flex items-start gap-4 af${iv?' v':''}`} style={{transitionDelay:`${i*0.1}s`}}>
                                    <div className="w-12 h-12 rounded-xl bg-em-500/10 border border-em-500/20 flex items-center justify-center text-em-400 flex-shrink-0">{icons[i]}</div>
                                    <div><div className="text-xs text-white/30 font-mono mb-1">0{i+1}</div><div className="text-sm text-white/70 font-medium">{step}</div></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </section>
        );
    }

    /* ===== EXPERIENCE ===== */
    function Exp(){
        const [r,iv]=useIV();
        const exs=[
            {t:'Отдел воронок',ic:<IcWF size={20}/>,items:['Создание автоворонок на GetCourse','Сегментация аудитории','E-mail коммуникации и цепочки','Telegram-воронки через Salebot/Senler','Оптимизация клиентского пути','A/B тестирование воронок']},
            {t:'Отдел продукта',ic:<IcLayers size={20}/>,items:['Настройка обучающих программ','Структурирование курсов','Управление обучающими платформами','Контроль качества контента','Техническое сопровождение']}
        ];
        return (
            <section id="exp" className="relative py-24 md:py-32 px-6">
                <div className="max-w-4xl mx-auto">
                    <ST title={U('ex.t')}/>
                    <div ref={r} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {exs.map((e,i)=>(
                            <div key={i} className={`gs rounded-2xl p-6 af${iv?' v':''}`} style={{transitionDelay:`${i*0.15}s`}}>
                                <div className="flex items-center gap-3 mb-5">
                                    <div className="w-10 h-10 rounded-xl bg-em-500/10 text-em-400 flex items-center justify-center">{e.ic}</div>
                                    <h3 className="text-lg font-semibold text-white">{e.t}</h3>
                                </div>
                                <ul className="space-y-3">{e.items.map((item,j)=><li key={j} className="flex items-start gap-3 text-sm text-white/50"><div className="w-1.5 h-1.5 rounded-full bg-em-500/50 mt-1.5 flex-shrink-0"/>{item}</li>)}</ul>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );
    }

    /* ===== EDUCATION ===== */
    function Edu(){
        const [r,iv]=useIV();
        const cs=[{t:'Project Manager',o:'GreenFreelance',y:'2024'},{t:'Наставничество студентов',o:'GreenFreelance',y:'2021'},{t:'Капитан GetCourse',o:'GreenFreelance',y:'2020'}];
        return (
            <section id="edu" className="relative py-24 md:py-32 px-6">
                <div className="max-w-3xl mx-auto">
                    <ST title={U('ed.t')}/>
                    <div ref={r} className="space-y-4">
                        {cs.map((c,i)=>(
                            <div key={i} className={`glass rounded-2xl p-5 flex items-center justify-between af${iv?' v':''}`} style={{transitionDelay:`${i*0.1}s`}}>
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 rounded-xl bg-em-500/10 text-em-400 flex items-center justify-center"><IcAward size={18}/></div>
                                    <div><h4 className="text-sm font-semibold text-white">{c.t}</h4><p className="text-xs text-white/40 mt-0.5">{c.o}</p></div>
                                </div>
                                <span className="text-xs text-white/30 font-mono bg-white/[0.03] rounded-lg px-3 py-1.5">{c.y}</span>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );
    }

    /* ===== CONTACT ===== */
    function Contact(){
        const [r,iv]=useIV();
        return (
            <section id="contact" className="relative py-24 md:py-32 px-6">
                <div className="max-w-3xl mx-auto text-center">
                    <div ref={r} className={`gs rounded-3xl p-10 md:p-16 relative overflow-hidden af${iv?' v':''}`}>
                        <div className="absolute inset-0 bg-gradient-to-b from-em-500/5 to-transparent pointer-events-none"/>
                        <div className="absolute -top-32 -right-32 w-64 h-64 rounded-full bg-em-500/10 pointer-events-none" style={{filter:'blur(100px)'}}/>
                        <div className="absolute -bottom-32 -left-32 w-64 h-64 rounded-full bg-em-600/10 pointer-events-none" style={{filter:'blur(100px)'}}/>
                        <div className="relative z-10">
                            <div className="w-14 h-14 rounded-2xl bg-em-500/10 border border-em-500/20 flex items-center justify-center text-em-400 mx-auto mb-6"><IcSend size={24}/></div>
                            <h2 className="text-2xl md:text-3xl font-bold text-white mb-4 leading-snug">{U('ct.t')}</h2>
                            <p className="text-sm text-white/40 mb-8">{U('ct.s')}</p>
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                                <a href="https://t.me/" target="_blank" rel="noopener" className="bp gb text-base py-3.5 px-8"><IcSend size={18}/>{U('ct.tg')}</a>
                                <a href="https://wa.me/" target="_blank" rel="noopener" className="bs text-base py-3.5 px-8"><IcPhone size={18}/>{U('ct.wa')}</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );
    }

    /* ===== FOOTER ===== */
    function Foot(){
        return (
            <footer className="border-t border-white/[0.04] py-8 px-6">
                <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                    <span className="text-xs text-white/25">{'\u00a9'} {new Date().getFullYear()} Владислав Слащевский</span>
                    <div className="flex items-center gap-6">
                        <a href="https://t.me/" target="_blank" rel="noopener" className="text-white/25 hover:text-em-400 transition-colors"><IcSend size={16}/></a>
                        <a href="https://wa.me/" target="_blank" rel="noopener" className="text-white/25 hover:text-em-400 transition-colors"><IcPhone size={16}/></a>
                    </div>
                </div>
            </footer>
        );
    }

    /* ===== APP ===== */
    function App(){
        const [lang,setLang]=React.useState('ru');
        React.useEffect(()=>{removeLoader();},[]);
        return (
            <LC.Provider value={{lang,setLang}}>
                <div className="relative z-10">
                    <Nav/><Hero/><About/><Impact/><Cases/><Skills/><Workflow/><Exp/><Edu/><Contact/><Foot/>
                </div>
            </LC.Provider>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
