    function useInView(opts = {}) {
        const [v, setV] = React.useState(false);
        const ref = React.useRef(null);
        React.useEffect(() => {
            const el = ref.current; if (!el) return;
            const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); obs.unobserve(el); } }, { threshold: 0.1, ...opts });

        }, []);
        return [ref, v];
    }

    function useCounter(end, dur = 2000, active = false) {
        const [val, setVal] = React.useState(0);

            if (!active) return;
            let st = null;
            const ease = t => 1 - Math.pow(1 - t, 3);
            const step = ts => {

                const p = Math.min((ts - st) / dur, 1);
                setVal(Math.round(end * ease(p)));
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }, [active, end, dur]);
        return val;
    }

    /* ==============================
       КОМПОНЕНТЫ ГРАФИКОВ
    ============================== */
    function LineChartSvg({ data, w = 700, h = 280, color = '#10b981', active }) {
        const pad = { t: 20, r: 20, b: 40, l: 55 };
        const cw = w - pad.l - pad.r;
        const ch = h - pad.t - pad.b;
        const vals = data.map(d => d.value);
        const maxV = Math.max(...vals);
        const minV = Math.min(...vals);
        const range = maxV - minV || 1;

        const pts = data.map((d, i) => ({
            x: pad.l + (i / Math.max(data.length - 1, 1)) * cw,
            y: pad.t + ch - ((d.value - minV) / range) * ch * 0.85 - ch * 0.05
        }));

        const linePath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ');
        const areaPath = `${linePath} L${pts[pts.length-1].x},${pad.t + ch} L${pts[0].x},${pad.t + ch} Z`;
        const dashLen = pts.reduce((acc, p, i) => {
            if (i === 0) return 0;
            const prev = pts[i-1];
            return acc + Math.sqrt((p.x - prev.x)**2 + (p.y - prev.y)**2);
        }, 0);

        const gridY = [0, 0.25, 0.5, 0.75, 1].map(pct => {
            const y = pad.t + ch * (1 - pct * 0.85 - 0.05);
            const v = minV + range * (pct * 0.85 + 0.05);
            return { y, v: Math.round(v) };
        });

        const gid = 'lg-' + color.replace('#', '');
        return (
            <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ overflow: 'visible' }}>
                <defs>
                    <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
                        <stop offset="100%" stopColor={color} stopOpacity="0"/>
                    </linearGradient>
                </defs>
                {gridY.map((g, i) => (
                    <g key={i}>
                        <line x1={pad.l} y1={g.y} x2={w - pad.r} y2={g.y} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
                        <text x={pad.l - 8} y={g.y + 4} textAnchor="end" fill="rgba(255,255,255,0.35)" fontSize="10" fontFamily="Inter">{(g.v / 1000).toFixed(0)}K</text>
                    </g>
                ))}
                <path d={areaPath} fill={`url(#${gid})`} className={`chart-area ${active ? 'visible' : ''}`}/>
                <path d={linePath} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                    className={`chart-line ${active ? 'visible' : ''}`} style={{'--dash-length': dashLen + 20}}/>
                {pts.map((p, i) => (
                    <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} stroke="#0a0c10" strokeWidth="2"
                        className={`chart-dot ${active ? 'visible' : ''}`} style={{ transitionDelay: `${1.5 + i * 0.1}s` }}/>
                ))}
                {data.map((d, i) => (
                    <text key={i} x={pts[i].x} y={h - 10} textAnchor="middle" fill="rgba(255,255,255,0.35)" fontSize="10" fontFamily="Inter">{d.label}</text>
                ))}
            </svg>
        );
    }

    function BarCompare({ before, after, label, active, beforeLabel, afterLabel }) {
        const max = Math.max(before, after) * 1.2 || 1;
        const bh = (before / max) * 120;
        const ah = (after / max) * 120;
        return (
            <div className="flex flex-col items-center gap-3">
                <div className="flex items-end gap-4" style={{ height: 140 }}>
                    <div className="flex flex-col items-center gap-1">
                        <span className="text-xs text-em-300 font-semibold">{afterLabel || after}</span>
                        <div className="w-12 rounded-t-md bar-grow" style={{ height: ah, background: 'linear-gradient(to top, #059669, #34d399)', transitionDelay: active ? '0.3s' : '0s' }} className={`bar-grow ${active ? 'visible' : ''}`}/>
                    </div>
                    <div className="flex flex-col items-center gap-1">
                        <span className="text-xs text-white/40 font-medium">{beforeLabel || before}</span>
                        <div className="w-12 rounded-t-md bar-grow" style={{ height: bh, background: 'rgba(255,255,255,0.1)', transitionDelay: active ? '0s' : '0s' }} className={`bar-grow ${active ? 'visible' : ''}`}/>
                    </div>
                </div>
                <span className="text-xs text-white/50 mt-1">{label}</span>
            </div>
        );
    }

    function SparkLine({ data, color = '#10b981', w = 80, h = 30 }) {
        const max = Math.max(...data); const min = Math.min(...data); const range = max - min || 1;
        const pts = data.map((v, i) => `${(i / (data.length - 1)) * w},${h - ((v - min) / range) * h * 0.8 - h * 0.1}`);
        return <svg viewBox={`0 0 ${w} ${h}`} className="w-full"><path d={`M${pts.join(' L')}`} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    }

    /* ==============================
       TOAST
    ============================== */
    let toastTimeout;
    function showToast(msg, type = 'info') {
        let existing = document.querySelector('.toast');
        if (existing) existing.remove();
        clearTimeout(toastTimeout);
        const el = document.createElement('div');
        el.className = `toast glass-strong ${type === 'info' ? 'text-em-300' : 'text-white'}`;
        el.textContent = msg;
        document.body.appendChild(el);
        toastTimeout = setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(10px)'; el.style.transition = 'all .3s'; setTimeout(() => el.remove(), 300); }, 3000);
    }
